name: Deploy FinSense to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Verify dist
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "===== DIST ====="
          find dist -type f | sort

          echo "===== INDEX ====="
          cat dist/index.html

          echo "===== CHECK ASSETS ====="
          test -f dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          test -n "$(find dist/assets -name '*.css' -print -quit)"

          echo "===== VERIFY REFERENCED FILES ====="

          JS_FILE=$(grep -o 'src="/FinSense/assets/[^"]*\.js"' dist/index.html | sed 's#src="/FinSense/assets/##;s/"$//')
          CSS_FILE=$(grep -o 'href="/FinSense/assets/[^"]*\.css"' dist/index.html | sed 's#href="/FinSense/assets/##;s/"$//')

          echo "JS:  $JS_FILE"
          echo "CSS: $CSS_FILE"

          test -f "dist/assets/$JS_FILE"
          test -f "dist/assets/$CSS_FILE"

          echo "BUILD ARTIFACT IS VALID"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4