name: Deploy FinSense to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build -- --base=/FinSense/

      - name: Verify build output
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "===== DIST ====="
          find dist -maxdepth 3 -type f | sort

          echo "===== INDEX ====="
          cat dist/index.html

          echo "===== VERIFY GITHUB PAGES BASE ====="
          grep -q 'src="/FinSense/assets/' dist/index.html
          grep -q 'href="/FinSense/assets/' dist/index.html

          echo "===== VERIFY ASSETS ====="

          JS_FILE=$(grep -o 'src="/FinSense/assets/[^"]*\.js"' dist/index.html | sed 's#src="/FinSense/assets/##;s/"$//')
          CSS_FILE=$(grep -o 'href="/FinSense/assets/[^"]*\.css"' dist/index.html | sed 's#href="/FinSense/assets/##;s/"$//')

          echo "JS: $JS_FILE"
          echo "CSS: $CSS_FILE"

          test -f "dist/assets/$JS_FILE"
          test -f "dist/assets/$CSS_FILE"

          echo "===== GITHUB PAGES BUILD VERIFIED ====="

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy FinSense
        id: deployment
        uses: actions/deploy-pages@v4